name: Weekly global geographic catalog capture
on:
  schedule:
    - cron: '37 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: global-catalog-capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Capture source metadata and geometry, without publishing
        run: |
          python tools/capture_catalog.py qa/catalog-candidate
          python tools/normalize_catalog.py qa/catalog-candidate qa/catalog-candidate/normalized.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-catalog-candidate
          path: qa/catalog-candidate/
          retention-days: 30
          if-no-files-found: error
