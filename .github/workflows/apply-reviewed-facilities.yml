name: Validate reviewed facilities and mobile navigation
on:
  push:
    branches: [feat/reviewed-facilities-and-mobile]
    paths: ['review-import/facilities.b64']
permissions:
  contents: write
jobs:
  apply-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/reviewed-facilities-and-mobile
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate complete source delta before writing
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma
          from pathlib import Path
          payload=Path('review-import/facilities.b64')
          packed=base64.b64decode(payload.read_text(),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='ea61215ac43b07bb627e4601391cdbdeee06b8af54285bff70e23d258b5175a4'
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          raw=decoder.decompress(packed,max_length=500000)
          assert decoder.eof and not decoder.unused_data and len(raw)==20326
          changes=json.loads(raw)
          assert set(changes)=={'data/evidence.json','src/responsive-nav.js','src/zoom-explorer.js','src/zoom-explorer.css','src/build.py','index.html','qa/service.py','qa/zoom-explorer.py'}
          outputs={}
          for name,item in changes.items():
              path=Path(name)
              if item['before']:
                  assert hashlib.sha256(path.read_bytes()).hexdigest()==item['before'], 'Concurrent change: '+name
                  text=path.read_text();last=len(text)+1
                  for start,end,replacement in reversed(item['edits']):
                      assert 0<=start<=end<last
                      text=text[:start]+replacement+text[end:];last=start+1
              else:
                  assert not path.exists()
                  text=item['text']
              assert hashlib.sha256(text.encode()).hexdigest()==item['sha256'],name
              outputs[path]=text
          for path,text in outputs.items(): path.write_text(text)
          payload.unlink()
          PY
          python src/build.py
          git config user.name 'Compute Atlas verified review'
          git config user.email 'compute-atlas@users.noreply.github.com'
          git add -A
          git commit -m 'feat: publish reviewed Lake Mariner, Waltham Cross and Narvik evidence; fix mobile navigation'
          git push origin HEAD:feat/reviewed-facilities-and-mobile
          mkdir -p qa/review
          git rev-parse HEAD > qa/review/COMMIT.txt
          rm -f qa/*_results.json
      - name: Install independent test environment
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
          CHROMIUM_PATH="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux64/chrome' | head -n 1)"
          test -n "$CHROMIUM_PATH"
          sudo ln -sf "$CHROMIUM_PATH" /usr/bin/chromium
      - name: Backend and all browser contracts
        run: |
          set -o pipefail
          python -m pytest tests -q | tee qa/review/backend.txt
          for file in src/*.js; do node --check "$file"; done
          python qa/integrity.py
          python qa/functional.py
          python qa/zoom-explorer.py
          python qa/smoke.py
          python qa/live.py
          python qa/service.py
          python src/build.py
          git diff --quiet -- compute_atlas.html
      - name: Acquire the expanded primary-source set
        timeout-minutes: 8
        run: |
          python -m server export /tmp/before.json
          python -m server refresh --limit 30 > qa/review/source-capture.json
          python -m server export /tmp/after.json
          cmp /tmp/before.json /tmp/after.json
          python - <<'PY'
          import json
          s=json.load(open('qa/review/source-capture.json'))
          print(json.dumps(s,indent=2))
          assert s['counts']['source_versions']>0
          PY
      - name: Record current results and exact source
        if: always()
        run: |
          mkdir -p qa/review
          git archive --format=zip HEAD > qa/review/compute-atlas-source.zip
          sha256sum qa/review/compute-atlas-source.zip > qa/review/SHA256SUMS
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          print('## Reviewed facilities + mobile — inspect job steps and source commit')
          for p in sorted(Path('qa').glob('*_results.json')):
              d=json.loads(p.read_text());print(f'- {p.name}: {d.get("passed")}/{d.get("total")}')
          print('Missing output is not a pass. Source acquisition never automatically publishes a numeric claim.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-facilities-browser-evidence
          retention-days: 7
          path: |
            qa/review/
            qa/*_results.json
            qa/screenshots/*.png
