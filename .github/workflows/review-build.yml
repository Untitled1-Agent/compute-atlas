name: Build and verify review branches

# Review branches are authored by repository writers, never fork PR code.
# Only the standalone and a hash-pinned, explicitly reviewed operator publication may be generated.
# The acceptance manifest is authored by a repository writer; main is never changed.
on:
  push:
    branches: ['review/**']

permissions:
  contents: read

concurrency:
  group: review-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install the checked-in test toolchain
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
          CHROMIUM_PATH="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux64/chrome' | head -n 1)"
          test -n "$CHROMIUM_PATH"
          sudo ln -sf "$CHROMIUM_PATH" /usr/bin/chromium
      - name: Materialize only an explicitly reviewed operator capture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/materialize_reviewed_directory.py
          python tools/materialize_digital_realty.py
      - name: Rebuild and test the actual source tree
        run: |
          python src/build.py
          python -m pytest tests -q
          for file in src/*.js; do node --check "$file"; done
          for suite in integrity functional zoom-explorer evidence-desk smoke live service source-health global-coverage site-identity catalog-explorer operator-directory; do
            python "qa/$suite.py"
          done
      - name: Commit only verified publication projections, with a head lease
        env:
          BRANCH: ${{ github.ref_name }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          case "$BRANCH" in review/*) ;; *) echo 'Not a review branch'; exit 1;; esac
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git add compute_atlas.html data/catalog/operator-directory.json data/catalog/digital-realty.json
          if ! git diff --cached --quiet; then
            git config user.name 'Compute Atlas verified build'
            git config user.email 'compute-atlas@users.noreply.github.com'
            git commit -m 'build: synchronize hash-pinned operator publication and standalone'
            git push origin "HEAD:$BRANCH"
          fi
          python tools/materialize_reviewed_directory.py
          python tools/materialize_digital_realty.py
          python src/build.py
          git diff --exit-code -- compute_atlas.html
      - name: Package the tested checkpoint
        run: |
          mkdir -p qa/review
          git rev-parse HEAD > qa/review/COMMIT.txt
          git rev-parse HEAD^{tree} > qa/review/TREE.txt
          git archive --format=zip HEAD > qa/review/compute-atlas-source.zip
          sha256sum qa/review/compute-atlas-source.zip > qa/review/SHA256SUMS
          echo '## Tested source checkpoint' >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'The permanent pull-request workflow must run again on this exact generated head before merge. This job does not merge branches.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compute-atlas-review-build
          retention-days: 14
          if-no-files-found: error
          path: |
            qa/review/
            qa/*_results.json
            qa/screenshots/*.png
