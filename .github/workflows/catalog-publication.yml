name: Publish verified catalog files to the review branch
on:
  push:
    branches: [feat/catalog-foundation]
permissions:
  contents: read
  actions: read
jobs:
  publish-reviewed-files:
    if: github.event.head_commit.message == 'Publish reviewed catalog foundation after independent verification'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: global-facility-capture
          run-id: 37385525742
          github-token: ${{ github.token }}
          path: /tmp/catalog-capture
      - name: Reproduce reviewed source bytes
        run: |
          set -euo pipefail
          python tools/normalize_catalog.py /tmp/catalog-capture data/catalog/osm.json
          echo '108c7065110bfb775d7d6ba7e7b6a52ce6e23559e4b72bbf45d98a221d9ea670  data/catalog/osm.json' | sha256sum -c -
          echo '7b3188dbf9ea60130606bbe164ff0f5fd2d076f4bc1e9949e6af6c93c17c9eaa  tools/catalog-foundation.patch' | sha256sum -c -
          git apply --check tools/catalog-foundation.patch
          git apply tools/catalog-foundation.patch
          python - <<'PY'
          import zipfile,hashlib
          from pathlib import Path
          with zipfile.ZipFile('data/catalog/source-capture.zip','w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for name in ['countries.geojson','manifest.json','osm-datacenters.json']:
                  info=zipfile.ZipInfo(name,date_time=(1980,1,1,0,0,0));info.compress_type=zipfile.ZIP_DEFLATED;info.external_attr=0o100644<<16
                  z.writestr(info,(Path('/tmp/catalog-capture')/name).read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          assert hashlib.sha256(Path('data/catalog/source-capture.zip').read_bytes()).hexdigest()=='fa3dc16383d6d938a48b8112b261efaf82d269a91b64360fe334d11a3a78a8b2'
          PY
          python -m pip install -r requirements-dev.txt
          python -m pytest tests -q
      - name: Store only the five verified files, never workflows or main
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const ref = 'heads/feat/catalog-foundation';
            if (context.ref !== 'refs/' + ref) throw new Error('Unexpected branch');
            const current = await github.rest.git.getRef({...context.repo, ref});
            if (current.data.object.sha !== context.sha) throw new Error('Branch advanced; review again');
            const tested = await github.rest.actions.getWorkflowRun({...context.repo, run_id:37540794529});
            if (tested.data.conclusion !== 'success' || tested.data.head_sha !== 'e15f013f462ba26fee014937087f2f1e4e6272c2') throw new Error('Required independent verification missing');
            const expected = {
              'server/app.py':'ad955ee84059a9cbe79cb469d30e1907d9b9cce32c1109362acc426d04b28434',
              'server/__main__.py':'e6ae3647e09f66a9dd155012550d0409e3f793a16d9a5948362df4d67b42424c',
              'server/acquire.py':'cc53c4cb2de0c06129248a91d4f794b145996bf89e41d5e98db3c44d3e0d3d22',
              'data/catalog/osm.json':'108c7065110bfb775d7d6ba7e7b6a52ce6e23559e4b72bbf45d98a221d9ea670',
              'data/catalog/source-capture.zip':'fa3dc16383d6d938a48b8112b261efaf82d269a91b64360fe334d11a3a78a8b2'
            };
            const tree = [];
            for (const [path, hash] of Object.entries(expected)) {
              const bytes = fs.readFileSync(path);
              if (crypto.createHash('sha256').update(bytes).digest('hex') !== hash) throw new Error('Checksum mismatch: ' + path);
              const blob = await github.rest.git.createBlob({...context.repo, content:bytes.toString('base64'), encoding:'base64'});
              tree.push({path, mode:'100644', type:'blob', sha:blob.data.sha});
            }
            tree.push({path:'tools/catalog-foundation.patch', mode:'100644', type:'blob', sha:null});
            const base = await github.rest.git.getCommit({...context.repo, commit_sha:context.sha});
            const created = await github.rest.git.createTree({...context.repo, base_tree:base.data.tree.sha, tree});
            const commit = await github.rest.git.createCommit({...context.repo, message:'data: publish verified global catalog foundation on review branch', tree:created.data.sha, parents:[context.sha]});
            await github.rest.git.updateRef({...context.repo, ref, sha:commit.data.sha, force:false});
            core.summary.addHeading('Verified review-branch checkpoint').addRaw(commit.data.sha).addRaw('\nNo workflow files or main were written. Independent PR checks remain required.').write();
