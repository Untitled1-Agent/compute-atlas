name: Verify and integrate reviewed site identities

# One-time writer-owned review branch. Removed before the clean source commit.
on:
  push:
    branches: [feat/site-identity-registry]
    paths:
      - '.github/workflows/identity-integration.yml'
      - 'tools/identity-*'
permissions:
  contents: read
concurrency:
  group: identity-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify exact base, readable patch and resulting source checksums
        run: |
          test "$(git rev-parse HEAD^)" = '28bef01074c5c675590493b693ef0f10e7aed847'
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          patch=Path('tools/identity-integration.patch').read_bytes()
          assert hashlib.sha256(patch).hexdigest()=='982b3693ca1718c3679399d3f435f3a53f14f657024159961d4a455ace9b3c47'
          evidence=Path('data/evidence.json')
          assert hashlib.sha256(evidence.read_bytes()).hexdigest()=='f4f70f21ce07a78e244d9571b60c220803eb6813dcb04268c16b907e8e7becb6'
          subprocess.run(['git','apply','--check','--unidiff-zero','tools/identity-integration.patch'],check=True)
          subprocess.run(['git','apply','--unidiff-zero','tools/identity-integration.patch'],check=True)
          original=json.loads(evidence.read_text());data=json.loads(evidence.read_text())
          additions=json.loads(Path('tools/identity-claims.json').read_text())
          assert len(additions)==6 and len({c['id'] for c in additions})==6
          assert not {c['id'] for c in additions}.intersection(c['id'] for c in data['facts'])
          data['facts'].extend(additions)
          assert all(data[k]==original[k] for k in original if k!='facts')
          assert data['facts'][:-6]==original['facts']
          evidence.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':'))+'\n')
          checks=json.loads(Path('tools/identity-checksums.json').read_text())
          assert len(checks)==20
          for name,expected in checks.items():
              actual=hashlib.sha256(Path(name).read_bytes()).hexdigest()
              print(name,actual)
              assert actual==expected, 'Source transfer mismatch: '+name
          Path('/tmp/identity-checked-paths.json').write_text(json.dumps(list(checks)))
          PY
          git rm tools/identity-integration.patch tools/identity-claims.json tools/identity-checksums.json .github/workflows/identity-integration.yml
      - name: Install reproducible toolchain
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
          CHROMIUM_PATH="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux64/chrome' | head -n 1)"
          test -n "$CHROMIUM_PATH"
          sudo ln -sf "$CHROMIUM_PATH" /usr/bin/chromium
      - name: Rebuild, check local artifact identity, and test real HTTP applications
        run: |
          python src/build.py
          echo '7dbe1db6f8988c097eca08f27e3b002838752c72f7e71063cf698d1c1d005d2f  compute_atlas.html' | sha256sum -c -
          python -m pytest tests -q | tee /tmp/identity-pytest.txt
          for file in src/*.js; do node --check "$file"; done
          for suite in integrity functional zoom-explorer evidence-desk smoke live service source-health global-coverage site-identity; do
            python "qa/$suite.py"
          done
      - name: Commit tested source only with a branch head lease
        env:
          BRANCH: ${{ github.ref_name }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$BRANCH" = 'feat/site-identity-registry'
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          paths=json.loads(Path('/tmp/identity-checked-paths.json').read_text())
          subprocess.run(['git','add','--',*paths,'compute_atlas.html'],check=True)
          PY
          git config user.name 'Compute Atlas verified review'
          git config user.email 'compute-atlas@users.noreply.github.com'
          git commit -m 'feat: preserve source-established site identities and explicit map precision'
          git push origin "HEAD:$BRANCH"
          python src/build.py
          git diff --exit-code -- compute_atlas.html
          test ! -e .github/workflows/identity-integration.yml
          test ! -e tools/identity-integration.patch
          test ! -e tools/identity-claims.json
          test ! -e tools/identity-checksums.json
      - name: Package verified source checkpoint
        run: |
          mkdir -p qa/review
          git rev-parse HEAD > qa/review/COMMIT.txt
          git rev-parse HEAD^{tree} > qa/review/TREE.txt
          git archive --format=zip HEAD > qa/review/compute-atlas-source.zip
          sha256sum qa/review/compute-atlas-source.zip > qa/review/SHA256SUMS
          cp /tmp/identity-pytest.txt qa/review/backend-tests.txt
          echo 'Independent PR CI must pass again on this cleaned head before merge.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-identity-verified-checkpoint
          retention-days: 14
          if-no-files-found: warn
          path: |
            qa/review/
            qa/*_results.json
            qa/screenshots/*.png
