name: Verify catalog UI source checkpoint
on:
  push:
    branches: [feat/catalog-3d-view]
permissions:
  contents: read
jobs:
  verify:
    if: startsWith(github.event.head_commit.message, 'Stage verified catalog UI')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Recover and verify exactly the locally tested source
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = b0d9bf08035fa7d8b118840f8d1b6b8d19143d54
          python - <<'PY'
          import gzip,hashlib,json,subprocess
          from pathlib import Path
          chunks=[Path(f'tools/catalog-ui-transfer-{i}.bin') for i in range(1,4)]
          raw=b''.join(p.read_bytes() for p in chunks)
          assert len(raw)==26327
          patch=gzip.decompress(raw)
          assert len(patch)==86864 and hashlib.sha256(patch).hexdigest()=='e0649cbd696332fb90b947f50e1e6bde919f85ace33d0a8d5d17e06c98a970d8'
          path=Path('/tmp/catalog-ui.patch');path.write_bytes(patch)
          subprocess.run(['git','apply','--check','--unidiff-zero',str(path)],check=True)
          subprocess.run(['git','apply','--unidiff-zero',str(path)],check=True)
          checks={
          'README.md':'016b588828019ac5cf36fc057f567430637f02cf816d931aa419b179b520657f',
          'docs/checkpoints/2026-10-07-catalog-3d-explorer.md':'fb510dade0427b810e35fe48d21d3b7b791ef26979f40ec09024bbf85b3a0cbc',
          'docs/checkpoints/README.md':'e15e87f8bb983bf13ba7fa4018092ae09dbe4a62cebba79477056c9b45ec7fd2',
          'index.html':'1869bfc7eb29b8ba0320230f917ca1b2119457977cc8ad10a71f9c0df6c61a45',
          'qa/catalog-explorer.py':'f0ff70be1a68b63288cdaa23e46f0992198d8735a852ebfafd5d0349db831da1',
          'qa/functional.py':'288885b05f3776ebded5eeaca3e3de38e0aaa39eed7b9eb242d6f1fa0507bbd7',
          'qa/global-coverage.py':'9fcfc729394de866440324c37546140d0dd5f2bc7e80ee6cffcfab9ab005725d',
          'qa/live.py':'b8bb9af0b252a6e944aae711e0ff372a8bf835f8a9b1a6683fa9551e1380bb33',
          'qa/service.py':'d9e2e4090f6ac0b09ba8e2aaf204582085a8a7b9eaa12de6a5e02c64a66ae63f',
          'qa/site-identity.py':'fad9156f8b2b18cac4a8ddb2239fac446e1c6d413fc5026c6aeeb58d7595514d',
          'qa/source-health.py':'8a95dad93b69345b925a0a215efa2ced2e43bb2830ac090d51a4a462b3b978e1',
          'qa/zoom-explorer.py':'dc561d83992817a34a06a650a24911c7eadf08f357c1dfb57c7c72a43804be98',
          'server/app.py':'b16b3001b3dada8ef2169742c29d7476cb998a0895980bda454e0a5a4ac50eee',
          'src/app.js':'627c577a63a1d3a9f79fa716a5bd0ee63d072e35cc52d019405646314273e9ef',
          'src/build.py':'9823d86942dc0c5932f3fc14d1884a309cd92d9e89c8f89f38a2d940482674bc',
          'src/cartography.js':'787d284494ae31de95b679a20ed3f220013d707bb7b66bfc41005d13464bac55',
          'src/catalog-explorer.css':'aa2306c1ed643d8843eb17789a9d84cb51f1e058bd7bc624f764e625fa11c7a6',
          'src/catalog-explorer.js':'a1c322b8c5e42f82c758d8ba853c2925c31b718cffd21b62bef15ac62ff35c72',
          'src/facility-scene.js':'d2bbdaa9bf2b94bfdd78771dbbb40cc7d28ba05411a3ffad93fbf03f0022c967',
          'src/index.html':'e28a32e133d60d0823cfcad1409a6584899fbf537a88e13c361906dc55875501'}
          for name,wanted in checks.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==wanted,name
          subprocess.run(['git','add','--',*checks],check=True)
          subprocess.run(['git','rm','--',*[str(p) for p in chunks]],check=True)
          Path('/tmp/catalog-ui-checksums.json').write_text(json.dumps(checks))
          PY
      - name: Install checked-in test toolchain
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
          CHROMIUM_PATH="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux64/chrome' | head -n 1)"
          test -n "$CHROMIUM_PATH"
          sudo ln -sf "$CHROMIUM_PATH" /usr/bin/chromium
      - name: Build and test actual sources over HTTP
        shell: bash
        run: |
          set -euo pipefail
          python src/build.py
          echo 'f8933970c59be00f6e06a3f9110c318e9aaf627c1576168dece84df20a0a6700  compute_atlas.html' | sha256sum -c -
          python -m pytest tests -q | tee /tmp/catalog-ui-pytest.txt
          for file in src/*.js; do node --check "$file"; done
          for suite in integrity functional zoom-explorer evidence-desk smoke live service source-health global-coverage site-identity catalog-explorer; do
            python "qa/$suite.py"
          done
      - name: Save only tested source on the review branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          test "$BRANCH" = feat/catalog-3d-view
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git add compute_atlas.html
          git diff --cached --name-only > /tmp/catalog-ui-staged.txt
          git config user.name 'Compute Atlas verified build'
          git config user.email 'compute-atlas@users.noreply.github.com'
          git commit -m 'feat: worldwide catalog, continuous wheel and source-outline facility 3D'
          git push origin "HEAD:$BRANCH"
          # This one-time workflow is deliberately not edited by the runner token.
          # The authorized connector removes it before opening the final clean PR.
      - name: Preserve recoverable tested checkpoint
        if: always()
        run: |
          mkdir -p qa/review
          git rev-parse HEAD > qa/review/COMMIT.txt
          git write-tree > qa/review/INDEX-TREE.txt
          git diff --cached --binary > qa/review/staged-source.patch
          git archive --format=zip HEAD > qa/review/compute-atlas-source.zip
          cp /tmp/catalog-ui-pytest.txt qa/review/ 2>/dev/null || true
          cp /tmp/catalog-ui-checksums.json qa/review/ 2>/dev/null || true
          sha256sum qa/review/compute-atlas-source.zip > qa/review/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-ui-verified-checkpoint
          retention-days: 14
          path: |
            qa/review/
            qa/*_results.json
            qa/screenshots/*.png
