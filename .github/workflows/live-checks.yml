name: Compute Atlas live checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: compute-atlas-live-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
          CHROMIUM_PATH="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux64/chrome' | head -n 1)"
          test -n "$CHROMIUM_PATH"
          sudo ln -sf "$CHROMIUM_PATH" /usr/bin/chromium
          /usr/bin/chromium --version
      - name: Evidence ledger, acquisition and API contracts
        run: python -m pytest tests -q
      - name: Research and archive integrity audit
        run: python qa/integrity.py
      - name: Verify generated standalone is synchronized
        timeout-minutes: 2
        run: |
          python src/build.py
          if ! git diff --quiet -- compute_atlas.html index.html; then
            echo '::error::Generated entrypoints are stale. Run python src/build.py and commit both HTML entrypoints.'
            git diff --stat -- compute_atlas.html index.html
            exit 1
          fi
      - name: JavaScript syntax checks
        run: |
          node --check src/prototype-atlas/design.js
          node --check src/spatial-math.js
          node --check src/pointer-gestures.js
          node --check src/app.js
          node --check src/enhancements.js
          node --check src/cartography.js
          node --check src/zoom-explorer.js
          node --check src/service-client.js
          node --check src/source-health.js
          node --check src/global-coverage.js
          node --check src/evidence-desk.js
          node --check src/site-identity.js
          node --check src/responsive-nav.js
          node --check src/facility-scene.js
          node --check src/catalog-explorer.js
          node --check src/directory-schema.js
          node --check src/operator-directory.js
          node --check src/digital-realty-schema.js
          node --check src/publisher-explorer.js
          node --check src/project-research.js
          node --check src/atlas-workspace.js
          node --check src/campus-scene.js
          node --check src/map-layers.js
          node --check src/inventory.js
          node --check src/connections.js
          node --check src/location-discovery.js
          node --check src/models.js
      - name: Isolated design study export and browser regressions
        run: python qa/design-review.py
      - name: Connected directory, company evidence and map source journeys
        if: ${{ !cancelled() }}
        run: python qa/connected.py
      - name: Saved models, comparisons and shared assumptions
        if: ${{ !cancelled() }}
        run: python qa/models.py
      - name: Bounded startup and recovery over real HTTP
        if: ${{ !cancelled() }}
        run: python qa/startup.py
      - name: Camera route ownership and protected source navigation
        if: ${{ !cancelled() }}
        run: python qa/camera-routes.py
      - name: Component native electricity and source-version recovery
        if: ${{ !cancelled() }}
        run: python qa/power-components.py
      - name: Global label contrast and source preservation
        if: ${{ !cancelled() }}
        run: python qa/global-labels.py
      - name: Functional suite
        if: ${{ !cancelled() }}
        run: python qa/functional.py
      - name: Six-scale semantic map suite over real HTTP
        if: ${{ !cancelled() }}
        run: python qa/zoom-explorer.py
      - name: Analyst evidence desk over real HTTP
        if: ${{ !cancelled() }}
        run: python qa/evidence-desk.py
      - name: Cited project research over real HTTP
        if: ${{ !cancelled() }}
        run: python qa/project-research.py
      - name: Exploration state and mockup layout over real HTTP
        if: ${{ !cancelled() }}
        run: python qa/experience.py
      - name: Regional landing analysis and historical campus entry
        if: ${{ !cancelled() }}
        run: python qa/landing.py
      - name: Map-led workspace and phase selection
        if: ${{ !cancelled() }}
        run: python qa/workspace.py
      - name: Editorial topic, selection and project comparison journeys
        if: ${{ !cancelled() }}
        run: python qa/editorial.py
      - name: Complete analyst sessions, citations and recovery
        if: ${{ !cancelled() }}
        run: python qa/analyst.py
      - name: Shared camera, map-linked records and mobile inspector
        if: ${{ !cancelled() }}
        run: python qa/exploration.py
      - name: Dated aerial and independent campus source-feature inspection
        run: python qa/campus.py
      - name: Physical feature, phase return, shelf and sourced campus journeys
        run: python qa/physical.py
      - name: Reviewed components, version recovery and responsive cameras
        run: python qa/components.py
      - name: Source-aware layers and independent electricity context
        run: python qa/layers.py
      - name: Geographic continuity, local roads and release integrity
        run: python qa/geographic.py
      - name: Authoritative smoke suite
        if: ${{ !cancelled() }}
        run: python qa/smoke.py
      - name: Live HTTP browser audit
        if: ${{ !cancelled() }}
        run: python qa/live.py
      - name: SQLite-backed app over real HTTP
        if: ${{ !cancelled() }}
        run: python qa/service.py
      - name: Source-health console over real HTTP
        if: ${{ !cancelled() }}
        run: python qa/source-health.py
      - name: Global disclosure coverage over real HTTP
        if: ${{ !cancelled() }}
        run: python qa/global-coverage.py
      - name: Site identity and coordinate precision over real HTTP
        if: ${{ !cancelled() }}
        run: python qa/site-identity.py
      - name: Worldwide catalog, continuous wheel and 3D over real HTTP
        if: ${{ !cancelled() }}
        run: python qa/catalog-explorer.py
      - name: Primary operator directory and source-bound map links
        if: ${{ !cancelled() }}
        run: python qa/operator-directory.py
      - name: Publisher source maps and cursor-anchored facility zoom
        if: ${{ !cancelled() }}
        run: python qa/publisher-explorer.py
      - name: Touch, sourced geometry selection and protected deployment prefix
        if: ${{ !cancelled() }}
        run: python qa/inspection.py
      - name: Summarize QA
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          print('## Compute Atlas QA')
          for name in ('connected_results.json','models_results.json','analyst_results.json','landing_results.json','camera_routes_results.json','power_components_results.json','global_labels_results.json','startup_results.json','components_results.json','physical_results.json','geographic_results.json','layers_results.json','campus_results.json','exploration_results.json','editorial_results.json','workspace_results.json','experience_results.json','integrity_results.json','functional_results.json','zoom_explorer_results.json','smoke_results.json','live_results.json','service_results.json','evidence_desk_results.json','project_research_results.json','source_health_results.json','global_coverage_results.json','site_identity_results.json','catalog_explorer_results.json','operator_directory_results.json','publisher_explorer_results.json','inspection_results.json'):
              path=Path('qa')/name
              if not path.exists():
                  print(f'- `{name}`: not produced')
                  continue
              data=json.loads(path.read_text())
              print(f'- `{name}`: **{data.get("passed")}/{data.get("total")} passed**')
          print('- Missing output is not a pass. The build-synchronization step remains mandatory.')
          PY
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compute-atlas-browser-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            qa/*_results.json
            qa/screenshots/*.png
            qa/overview.png
            qa/mobile.png
